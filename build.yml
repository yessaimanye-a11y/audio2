name: Build macOS DMG

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build app and DMG
        run: bash Scripts/build.sh

      - name: Upload DMG (download from the run page)
        uses: actions/upload-artifact@v4
        with:
          name: AudioController-dmg
          path: build/AudioController.dmg

      - name: Publish rolling release "latest"
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: build/AudioController.dmg
