name: Build macOS DMG

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build app and DMG
        run: bash Scripts/build.sh

      - name: Publish rolling release "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: build/AudioController.dmg
